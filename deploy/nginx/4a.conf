# 4A 平台反向代理：静态托管前端 + 转发 /api 到后端
server {
    listen 443 ssl http2;
    server_name iam.corp.example.com;

    ssl_certificate     /etc/nginx/certs/iam.crt;
    ssl_certificate_key /etc/nginx/certs/iam.key;

    # 前端静态产物（frontend/dist）
    root /opt/4a-platform/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /healthz { proxy_pass http://127.0.0.1:8000/healthz; }
    location /readyz  { proxy_pass http://127.0.0.1:8000/readyz; }
}
